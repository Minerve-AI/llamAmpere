name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.3.1, b1)"
        type: string
        required: true
        default: "b1"

env:
  CUDA_VER: "12.4"
  CUDA_CUDART_VER: "12.4.127"
  CUDA_CUBLAS_VER: "12.4.5.8"
  NVCUFPX_VER: "12.4.127"

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CUDA 12.4 redistributables
        shell: powershell
        run: |
          $cuda_base = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${env:CUDA_VER}"
          New-Item -ItemType Directory -Force -Path "$cuda_base\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cuda_base\bin\x64" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cuda_base\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cuda_base\lib\x64" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cuda_base\nvvm\libdevice" | Out-Null

          $redist_base = "https://developer.download.nvidia.com/compute/cuda/redist"

          # cudart
          $url = "$redist_base/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-${env:CUDA_CUDART_VER}-archive.zip"
          Write-Host "Downloading cudart: $url"
          Invoke-WebRequest -Uri $url -OutFile "cudart.zip"
          Expand-Archive -Path "cudart.zip" -DestinationPath "$cuda_base" -Force
          Remove-Item "cudart.zip"

          # cublas
          $url = "$redist_base/libcublas/windows-x86_64/libcublas-windows-x86_64-${env:CUDA_CUBLAS_VER}-archive.zip"
          Write-Host "Downloading cublas: $url"
          Invoke-WebRequest -Uri $url -OutFile "cublas.zip"
          Expand-Archive -Path "cublas.zip" -DestinationPath "$cuda_base" -Force
          Remove-Item "cublas.zip"

          # nvcc (for compilation)
          $url = "$redist_base/cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-${env:CUDA_CUDART_VER}-archive.zip"
          Write-Host "Downloading nvcc: $url"
          Invoke-WebRequest -Uri $url -OutFile "nvcc.zip"
          Expand-Archive -Path "nvcc.zip" -DestinationPath "$cuda_base" -Force
          Remove-Item "nvcc.zip"

          # Verify
          Write-Host "CUDA install structure:"
          Get-ChildItem "$cuda_base\bin" -Filter "*.dll" | Select-Object Name
          Get-ChildItem "$cuda_base\bin\x64" -Filter "*.dll" | Select-Object Name

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 (
            echo "Failed to initialize MSVC environment"
            exit /b 1
          )
          set "PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin;%PATH%"

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=ON ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON

          cmake --build build --config Release --parallel

      - name: Package
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $out = "llama-$tag-bin-win-cuda-12.4-x64"
          New-Item -ItemType Directory -Force -Path "$out" | Out-Null

          # Copy binaries
          $bin_dir = "build\Release"
          Copy-Item "$bin_dir\llama-server.exe" "$out\" -ErrorAction SilentlyContinue
          Copy-Item "$bin_dir\llama-cli.exe" "$out\" -ErrorAction SilentlyContinue
          Copy-Item "$bin_dir\llama-quantize.exe" "$out\" -ErrorAction SilentlyContinue
          Copy-Item "$bin_dir\llama-bench.exe" "$out\" -ErrorAction SilentlyContinue

          # Copy ggml DLLs
          Get-ChildItem "$bin_dir\ggml-*.dll" | Copy-Item -Destination "$out\"
          Get-ChildItem "$bin_dir\llama.dll" | Copy-Item -Destination "$out\" -ErrorAction SilentlyContinue

          # Copy CUDA runtime DLLs
          $cuda_bin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"
          $cuda_bin_x64 = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\x64"
          Get-ChildItem "$cuda_bin" -Filter "cudart64_*.dll" | Copy-Item -Destination "$out\" -ErrorAction SilentlyContinue
          Get-ChildItem "$cuda_bin" -Filter "cublas64_*.dll" | Copy-Item -Destination "$out\" -ErrorAction SilentlyContinue
          Get-ChildItem "$cuda_bin" -Filter "cublasLt64_*.dll" | Copy-Item -Destination "$out\" -ErrorAction SilentlyContinue
          Get-ChildItem "$cuda_bin_x64" -Filter "cudart64_*.dll" | Copy-Item -Destination "$out\" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$cuda_bin_x64" -Filter "cublas64_*.dll" | Copy-Item -Destination "$out\" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$cuda_bin_x64" -Filter "cublasLt64_*.dll" | Copy-Item -Destination "$out\" -Force -ErrorAction SilentlyContinue

          # Compress
          Compress-Archive -Path "$out\*" -DestinationPath "llama-$tag-bin-win-cuda-12.4-x64.zip" -Force

          Write-Host "Package contents:"
          Get-ChildItem "llama-$tag-bin-win-cuda-12.4-x64.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-win-cuda-12.4-x64
          path: llama-*-bin-win-cuda-12.4-x64.zip

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $artifact = "llama-$tag-bin-win-cuda-12.4-x64.zip"

          gh release create "$tag" `
            --title "llamAmpere $tag - Windows x64 (CUDA 12.4)" `
            --notes "Auto-built for Windows x64 with CUDA 12.4.`n`nContents:`n- llama-server.exe`n- ggml-cuda.dll + CUDA runtime DLLs`n- llama-cli.exe, llama-quantize.exe, llama-bench.exe" `
            --draft `
            "$artifact"

          Write-Host "Draft release created: $tag"
